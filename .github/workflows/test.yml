name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Install dependencies
      run: go mod download
    
    - name: Install build tools for CGO
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc
    
    - name: Run tests
      run: go test -v -timeout 30s -run "TestCongestionControl|TestFlowControl|TestEnhancedStatsTracker|TestReceiveQueue"
    
    - name: Run tests with race detection
      run: CGO_ENABLED=1 go test -v -race -timeout 30s -run "TestCongestionControl|TestFlowControl|TestEnhancedStatsTracker|TestReceiveQueue"

    - name: Run tests with coverage
      run: go test -v -coverprofile=coverage.out -timeout 30s -run "TestCongestionControl|TestFlowControl|TestEnhancedStatsTracker|TestReceiveQueue"
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
